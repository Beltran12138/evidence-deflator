# Daily refresh of the Hyperliquid wallet board and the frozen cohort's forward record.
# Also rescores the forward registry (wallets registered through GitHub issues).
# Writes docs/data/hl/latest.json, docs/data/registry/registry.json and the pages built from them, commits only if they changed.
name: hl-daily
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: hl-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install markdown opencc-python-reimplemented==0.1.7
      - name: Build board, cohort and registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/build_hl_board.py --cache .hlcache --refresh \
            --out docs/data/hl/latest.json --cohort docs/data/hl/cohort-2026-10-14.json
          python tools/check_hl_parity.py --cache .hlcache
          python tools/build_registry.py --out docs/data/registry/registry.json
          python tools/build_site.py
      - name: Commit if changed
        run: |
          git config user.name "hl-daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/hl/latest.json docs/wallet/index.html docs/index.html docs/sitemap.xml docs/q docs/zh-hans docs/zh-hant docs/data/registry docs/registry
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: Hyperliquid board $(date -u +%Y-%m-%d)"
          git push
          sleep 90  # let Pages deploy before the engines come to look
          python tools/indexnow.py / /wallet/ /zh-hans/ /zh-hant/ || echo "IndexNow ping failed (not fatal)"
