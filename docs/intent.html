<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你到底想用这笔钱干什么 · 深圳新书分享 1024</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Talk, not pitch: one idea per slide, product only on the last. Same keynote ground as the Macau deck (black, white, one red). */
:root{--bg:#050505;--ink:#F3F3F1;--mid:#A3A3A0;--low:#6B6B68;--red:#FF4B3E;--line:#262626;--mono:'JetBrains Mono',Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
nav{position:fixed;top:14px;right:24px;display:flex;gap:4px;z-index:3}
nav button{font:12px Consolas,monospace;color:var(--low);background:none;border:0;padding:4px 6px;cursor:pointer}
nav button.on{color:var(--ink)}
footer{position:fixed;left:80px;bottom:26px;font-size:18px;color:var(--low);letter-spacing:.04em}
main{height:76.9%;display:flex;zoom:1.3}
.slide{display:none;flex:1;padding:50px 62px 0;flex-direction:column;justify-content:flex-start}
.slide.on{display:flex;animation:in .4s ease both}
.static .slide.on{animation:none}.static nav{display:none}
@keyframes in{from{opacity:0}to{opacity:1}}
h1{font-size:84px;font-weight:900;line-height:1.18;letter-spacing:-.01em}
h2{font-size:62px;font-weight:900;line-height:1.2;letter-spacing:-.01em}
.lede{font-size:32px;color:var(--mid);margin-top:26px;line-height:1.5;font-weight:500;max-width:1600px}
.lede b{color:var(--ink);font-weight:700}
.red{color:var(--red)}.mid{color:var(--mid)}
.m{font-family:var(--mono);font-weight:700}
.src{font-size:13px;color:var(--low);margin-top:26px;line-height:1.6;max-width:1700px}
.tag{font:700 20px var(--mono);letter-spacing:.14em;color:var(--red);margin-bottom:18px}
.cover{padding-top:96px}
.cover .sub{font-size:38px;color:var(--mid);margin-top:30px;font-weight:500}
.cover .who{margin-top:64px;font-size:26px;color:var(--mid)}.cover .who b{color:var(--ink);font-weight:700;margin-right:18px}
.quote{font-size:96px;font-weight:900;line-height:1.2;margin-top:30px}
.term{margin-top:34px;font:500 25px/1.75 var(--mono);color:var(--mid);border:1px solid var(--line);background:#0C0C0C;border-radius:6px;padding:24px 32px;max-width:1500px}
.term b{color:var(--ink)}.term .no{color:var(--red)}.term .k{color:var(--low)}
.big{display:flex;gap:80px;margin-top:44px;align-items:flex-end}
.big div{max-width:520px}
.big .n{font:800 120px/1 var(--mono);letter-spacing:-.03em}
.big .n small{font-size:48px;color:var(--mid);margin-left:6px}
.big p{font-size:28px;color:var(--mid);line-height:1.45;margin-top:14px}
.big p b{color:var(--ink)}
.said{margin-top:44px;font-size:32px;line-height:1.5;color:var(--mid);border-left:4px solid var(--red);padding-left:24px;max-width:1550px}
.said b{color:var(--ink)}
.qs{margin-top:36px;border-top:1px solid var(--line);max-width:1650px}
.qs .r{display:grid;grid-template-columns:90px 1fr 1fr;gap:30px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line)}
.qs .r i{font:800 44px var(--mono);font-style:normal;color:var(--red)}
.qs .r b{font-size:38px;font-weight:900}
.qs .r span{font-size:28px;color:var(--mid);line-height:1.4}
.loop{display:grid;grid-template-columns:repeat(4,1fr);margin-top:44px;border-top:1px solid var(--line)}
.loop div{padding:26px 30px 10px 0}
.loop div+div{padding-left:30px;border-left:1px solid var(--line)}
.loop h3{font:700 22px var(--mono);color:var(--red);letter-spacing:.08em;margin-bottom:14px}
.loop p{font-size:32px;font-weight:700;line-height:1.35}
.loop p.mid{font-size:26px;font-weight:500;margin-top:10px}
.ask{display:grid;grid-template-columns:1fr auto;gap:60px;align-items:start}
.steps{margin-top:34px;font-size:30px;line-height:1.7;color:var(--mid)}
.steps b{color:var(--ink)}
.try{display:flex;align-items:center;gap:32px;margin-top:40px}
.try b{display:block;font-size:30px;color:var(--ink);font-weight:900}.try span{font-size:32px;color:var(--mid)}
.qr{text-align:center;font-size:18px;color:var(--mid)}
.qr svg,.qr img{display:block;width:200px;height:200px;margin:0 auto 12px;background:#fff;padding:12px}
.qr.big2{font-size:22px;line-height:1.6}.qr.big2 b{display:block;font-size:30px;color:var(--ink);margin-bottom:2px}
.qr.big2 img{width:380px;height:380px;margin-bottom:20px}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="stage"></main>
<footer>伯纳德 · 《AI 智能投资手册》第九章</footer>

const S=[
// 00
`<div class="slide cover">
 <div class="tag">《AI 智能投资手册》新书分享</div>
 <h1>你到底想用<br>这笔钱干什么？</h1>
 <div class="sub">让 AI 替你投资之前，先和自己对齐</div>
 <div class="who"><b>伯纳德</b>《AI 智能投资手册》第九章作者</div>
</div>`,
// 01
`<div class="slide">
 <div class="tag">一个小实验</div>
 <h2>如果明天让 AI 替你管钱，你会怎么跟它说？</h2>
 <div class="quote">「我想稳一点，帮我赚钱。」</div>
 <div class="term"><span class="k">把这句话交给一个规则解析器：</span><br>
  <span class="no">没看懂</span>：「我想稳一点」<br>
  <span class="no">没看懂</span>：「帮我赚钱」<br>
  <span class="k">缺：</span>能买哪些、单笔多大、一天最多亏多少、每只最多拿多少</div>
</div>`,
// 02
`<div class="slide">
 <div class="tag">ALIGNMENT · 对齐</div>
 <h2>大模型公司在做对齐：<br>让 AI 做人想要的事</h2>
 <div class="lede">落到每个人身上，就是让 AI 做<b>你</b>想要的事。<br>但最难的一步不在 AI，<b class="red">在我们自己说不清自己想要什么。</b></div>
</div>`,
// 02b questionnaire
`<div class="slide">
 <div class="tag">你填过的风险测评</div>
 <h2>风险问卷，测不准你</h2>
 <div class="big">
  <div><div class="n">&lt;15<small>%</small></div><p>问卷能解释的<b>投资者之间实际持仓差异</b>，通常不到这个比例</p></div>
 </div>
 <div class="said">原因是问卷问的大多是收入、年龄和假设情境，<b>不是你真到亏钱那天会怎么做。</b></div>
 <div class="src">Klement, Investor Risk Profiling: An Overview, CFA Institute Research Foundation, 2015 原文：risk profiling through questionnaires is highly unreliable and typically explains less than 15% of the variation in risky assets between investors—mostly because the questionnaires focus on socio-economic variables and hypothetical scenarios</div>
</div>`,
// 03 (stated vs did)
`<div class="slide">
 <div class="tag">说的和做的</div>
 <h2>让人事先写规则，规则会被自己推翻</h2>
 <div class="big">
  <div><div class="n">114<small>/140</small></div><p>条规则，用户选了<b>「到时候再问我」</b></p></div>
  <div><div class="n">133<small>/148</small></div><p>次越权操作，是用户<b>当场亲手批准</b>放行的</p></div>
 </div>
 <div class="said">事先说「要管住」，事到临头又说「这次算了」。<b>研究者把它叫作偏好与承诺之间的落差。</b></div>
 <div class="src">arXiv 2608.27443（2026-08，预注册实验，113 名非技术用户）原文：participants chose "ask" for 114 of 140 POLICY rules … Of the 148 overreach actions executed in POLICY, 133 followed … user approval … a gap between preference and commitment</div>
</div>`,
// 04 choices
`<div class="slide">
 <div class="tag">怎么问才问得清</div>
 <h2>让人挑，比让人说准</h2>
 <div class="lede">一项研究发现：<b>让人在具体选项之间做两次选择</b>，预测他真实偏好的效果，就抵得上让他自己写一段描述。</div>
 <div class="term"><span class="k">所以与其问「你能承受多大风险？」，不如直接给你看几张单子：</span><br>
  买 SPY $5,000　　　<b>拦</b> 还是 <b>放</b>？<br>
  一天已经亏了 $180，再买 $100　　<b>拦</b> 还是 <b>放</b>？<br>
  TSLA，不在你说过的名单里　　<b>拦</b> 还是 <b>放</b>？</div>
 <div class="src">arXiv 2603.29317（2026-03）原文：individuals communicate their preferences more effectively through choices, with as few as two sufficing to match prompts' predictive value</div>
</div>`,
// 05 three questions
`<div class="slide">
 <div class="tag">给自己的三个问题</div>
 <h2>交给 AI 之前，先回答这三个问题</h2>
 <div class="qs">
  <div class="r"><i>01</i><b>这笔钱拿来干什么？</b><span>什么时候要用，用不到会怎样</span></div>
  <div class="r"><i>02</i><b>亏到多少你会受不了？</b><span>不是「能承受」，是「会卖掉」的那个数</span></div>
  <div class="r"><i>03</i><b>什么情况说明你看错了？</b><span>第九章：写不出失效条件的判断，不算判断</span></div>
 </div>
 <div class="lede" style="font-size:28px">机构早就这么做：先写<b>投资政策说明书</b>（目标、风险承受度、期限、流动性），它最大的用处是<b>市场慌乱时替你的情绪做决定</b>。</div>
 <div class="src">CFA Institute, Elements of an Investment Policy Statement for Individual Investors (2010)：the IPS serves as a policy guide that can offer an objective course of action … during periods of market disruption。风险＝这笔钱达不成用途的概率，每个账户可以不同：Das, Markowitz, Scheid, Statman, JFQA 2010</div>
</div>`,
// 06 what a machine can and cannot read
`<div class="slide">
 <div class="tag">机器能替你做的，和不能的</div>
 <h2>规则能读懂「怎么买」，读不懂「为什么」</h2>
 <div class="term"><span class="k">输入：</span><b>这笔钱三年后买房用，只做苹果和标普，单笔不超过 500，一天最多亏 200，每只最多拿 2000</b><br><br>
  单笔上限 500　　　← 「单笔不超过 500」<br>
  每日亏损上限 200　← 「一天最多亏 200」<br>
  单标的上限 2000　 ← 「每只最多拿 2000」<br>
  标的名单 AAPL、SPY ← 「苹果、标普」<br>
  <span class="no">没看懂</span>：「这笔钱三年后买房用」</div>
 <div class="said">「三年后买房」该推出什么限额，<b>只能你自己想清楚</b>。机器能做的，是把你想清楚的部分管住、记下来。</div>
</div>`,
// 07 alignment is a loop (ch9)
`<div class="slide">
 <div class="tag">第九章 · 复盘</div>
 <h2>对齐不是一次说清，是一个反馈环</h2>
 <div class="loop">
  <div><h3>写下来</h3><p>决策当天的判断快照</p><p class="mid">结论、驱动、失效条件</p></div>
  <div><h3>照着做</h3><p>边界由你事先划定</p><p class="mid">事到临头不临时改口</p></div>
  <div><h3>对一对</h3><p>用核对代替回忆</p><p class="mid">说的和做的，哪里不一样</p></div>
  <div><h3>改规则</h3><p>改方法，不改记录</p><p class="mid">每次修改都留下变更记录</p></div>
 </div>
 <div class="said">每转一圈，你对「自己想要什么」就清楚一点。<b>这才是个人的对齐。</b></div>
</div>`,
// 08 boundary outside the model
`<div class="slide">
 <div class="tag">为什么边界要放在 AI 外面</div>
 <h2>模型再强，也不会自动知道「该停了」</h2>
 <div class="big">
  <div><div class="n">59.5<small>%</small></div><p>17 个前沿模型判断「这件事我该不该停下来」，<b>最好的一个</b>的准确率</p></div>
 </div>
 <div class="said">而且这项能力<b>和模型整体强弱基本无关</b>。所以你的底线，不能指望 AI 自觉，要写下来、签上名，放在 AI 管不到的地方执行。</div>
 <div class="src">arXiv 2607.10059 AgentAbstain（2026-07）原文：59.5% paired accuracy … abstention capability is largely independent of general task-solving capability。OpenAI Model Spec（2026-08-18）也建议把授权范围记成结构化记录，并且每份授权都要有结束条件。</div>
</div>`,
// 09 product
`<div class="slide">
 <div class="ask">
  <div><div class="tag">我们在做的</div><h2>Evidence Deflator</h2>
   <div class="steps"><b>一句话</b>写下你的底线 → <b>看例子</b>确认拦还是放 → <b>签名</b><br>→ 闸门替你守住 → 每一笔<b>签名入账</b>，复盘时拿来核对</div>
   <div class="try"><div class="qr">${QR}</div><div><b>体验</b><span>evidencedeflator.com/gate</span></div></div></div>
  <div class="qr big2"><img src="assets/wechat-qr.png" alt="微信" onerror="this.parentNode.remove()"><b>欢迎交流</b>微信 · 伯纳德</div>
 </div>
</div>`
];
const stage=document.getElementById('stage'),nav=document.getElementById('nav');
S.forEach((h,i)=>{const b=document.createElement('button');b.textContent=String(i).padStart(2,'0');b.onclick=()=>go(i);nav.appendChild(b);
 const t=document.createElement('div');t.innerHTML=h.trim();stage.appendChild(t.firstChild);});
if(new URLSearchParams(location.search).has('static'))document.documentElement.classList.add('static');
let cur=-1;
function go(i){if(i<0||i>=S.length||i===cur)return;cur=i;
 [...stage.children].forEach((el,k)=>el.classList.toggle('on',k===i));
 [...nav.children].forEach((el,k)=>el.classList.toggle('on',k===i));}
document.addEventListener('keydown',e=>{
 if(['ArrowRight','PageDown',' '].includes(e.key))go(Math.min(cur+1,S.length-1));
 else if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1);
 else if(/^[0-9]$/.test(e.key))go(+e.key);
});
go(+(new URLSearchParams(location.search).get("s")||0));
function fit(){document.documentElement.style.zoom=Math.min(innerWidth/1920,innerHeight/1080).toFixed(3)}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
