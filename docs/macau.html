<style>
:root{--bg:#0B0D10;--panel:#101319;--ink:#E9E5DC;--dim:#767C85;--dim2:#565C64;

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Microsoft YaHei','PingFang SC',sans-serif;
     -webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:Consolas,'JetBrains Mono',monospace}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:26px;
       padding:0 42px;height:58px;border-bottom:1px solid var(--rule);background:rgba(11,13,16,.92);z-index:5}
.brand{font-family:Consolas,monospace;font-weight:700;font-size:15px;letter-spacing:.06em}
.brand em{color:var(--gold);font-style:normal}
nav{display:flex;gap:6px;margin-left:auto}
nav button{font-family:Consolas,monospace;font-size:12px;letter-spacing:.1em;color:var(--dim);
     background:transparent;border:1px solid transparent;padding:7px 11px;cursor:pointer;border-radius:2px}
nav button.on{color:var(--ink);border-color:var(--rule)}
footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:18px;
       padding:0 42px;height:46px;border-top:1px solid var(--rule2);color:var(--dim2);
       font-size:14px;font-family:Consolas,monospace;letter-spacing:.05em;background:rgba(11,13,16,.92)}
footer .keys{margin-left:auto;letter-spacing:.12em}
main{height:100%;padding:58px 0 46px;display:flex}
.slide{display:none;flex:1;padding:0 max(42px,6vw);align-items:center;justify-content:center}
.slide.on{display:flex;animation:rise .45s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cover{flex-direction:column;text-align:center;gap:4vh}
.kick{font-family:Consolas,monospace;font-size:14px;letter-spacing:.3em;color:var(--gold)}
.cover h1{font-family:'Noto Serif SC',serif;font-size:clamp(30px,4.2vw,52px);font-weight:600;line-height:1.3}
.nums{display:flex;gap:5vw;justify-content:center;align-items:baseline}
.nums div{text-align:center}
.nums b{display:block;font-family:Consolas,monospace;font-weight:700;font-size:clamp(46px,7.5vw,104px);line-height:1}
.nums span{display:block;margin-top:12px;font-size:14px;color:var(--dim);letter-spacing:.06em;max-width:220px}
.c-ink{color:var(--ink)}.c-dim{color:var(--dim)}
[hidden]{display:none!important}.c-red{color:var(--red)}.c-gold{color:var(--gold)}.c-grn{color:var(--grn)}
.sub{font-family:'Noto Serif SC',serif;font-size:clamp(17px,1.7vw,24px);color:var(--dim);max-width:980px}
.sub b{color:var(--ink);font-weight:600}
.scene{gap:max(46px,5vw)}
.left{max-width:500px}
.tagline{font-family:Consolas,monospace;font-size:14px;letter-spacing:.26em;color:var(--gold);margin-bottom:22px}
.story{font-family:'Noto Serif SC',serif;font-size:clamp(23px,2.35vw,34px);font-weight:600;line-height:1.62}
.story em{font-style:normal;color:var(--gold)}
.story .r{color:var(--red)}
.moral{margin-top:26px;font-size:15.5px;line-height:1.8;color:var(--dim);border-left:2px solid var(--rule);padding-left:16px}
.card{width:min(520px,44vw);background:var(--panel);border:1px solid var(--rule);border-top:2px solid rgba(201,162,76,.55);
      padding:34px 38px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 14px 34px rgba(0,0,0,.38)}
.cap{font-family:Consolas,monospace;font-size:14px;letter-spacing:.2em;color:var(--dim);margin-bottom:18px}
.big{font-family:Consolas,monospace;font-weight:700;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:27px;color:var(--dim);font-weight:400}
.badge{display:inline-block;font-family:Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.14em;
       padding:6px 15px;border-radius:2px;margin:18px 0 4px}
.badge.warn{color:var(--gold);border:1px solid var(--gold);background:rgba(201,162,76,.09)}
.badge.bad{color:var(--red);border:1px solid var(--red);background:rgba(196,69,60,.10)}
.badge.ok{color:var(--grn);border:1px solid var(--grn);background:rgba(94,140,106,.12)}
.badge.dim{color:var(--dim);border:1px solid var(--rule)}
.rows{margin-top:20px;border-top:1px solid var(--rule2)}
.rows div{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule2)}
.rows dt{font-size:14px;color:var(--dim)}
.rows dd{font-family:Consolas,monospace;font-size:16px;font-variant-numeric:tabular-nums}
.rows .key dd{font-size:22px;color:var(--gold);font-weight:700}
/* bar scale: t against the two bars */
.scale{position:relative;height:56px;margin:26px 0 6px;border-bottom:1px solid var(--rule)}
.scale .ln{position:absolute;bottom:0;width:2px;height:44px}
.scale .ln span{position:absolute;bottom:50px;transform:translateX(-50%);white-space:nowrap;font:13px Consolas,monospace}
.scale .t2{background:var(--dim)}.scale .t2 span{color:var(--dim)}
.scale .bn{background:var(--red)}.scale .bn span{color:var(--red)}
.scale .pt{position:absolute;bottom:14px;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}

.flip{display:block;width:100%;height:auto;margin:14px 0 4px;overflow:visible;cursor:pointer}
.flip text{font:12px Consolas,monospace;fill:var(--dim)}
.flip .dot{fill:var(--gold);transition:transform 1.1s cubic-bezier(.6,0,.25,1),fill .9s ease,opacity .6s ease}
.flip.b .dot{fill:var(--ink);opacity:.82}.flip.b .dot.nt{opacity:0}
.flip .ga,.flip .gb,.flip .gc,.flip .zone{transition:opacity .5s ease}
.flip .gb,.flip .gc,.flip .zone{opacity:0}.flip.b .ga{opacity:0}.flip.b .gb{opacity:1}.flip.c .gc,.flip.c .zone{opacity:1}
.flip .drop{transform:scaleY(0);transform-origin:0 0;transform-box:fill-box;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.flip.c .drop{transform:none}
.flip .zone{fill:rgba(196,69,60,.10)}.flip .zt{fill:var(--red)}
.flip .ln2{stroke:var(--dim);stroke-width:1.5}.flip .lnb{stroke:var(--red);stroke-width:2}.flip .ax{stroke:var(--rule2)}
#flipcard{padding:28px 38px}#flipcard .big{font-size:62px}#flipcard .badge{margin:12px 0 2px}#flipcard .rows{margin-top:12px}#flipcard .rows div{padding:9px 0}
.end{transition:opacity .5s ease}.card:not(.d) .end{opacity:0}
.flip.now .dot,.flip.now .drop,.flip.now *,.card.now .end{transition:none!important}
/* live demo */
.demo input{width:100%;font:16px Consolas,monospace;padding:13px 14px;background:#0B0D10;color:var(--ink);border:1px solid var(--rule);border-radius:2px}
.demo input:focus{outline:none;border-color:var(--gold)}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ex button{font:13px Consolas,monospace;padding:7px 10px;background:transparent;color:var(--dim);border:1px solid var(--rule);border-radius:2px;cursor:pointer}
.ex button:hover{color:var(--ink);border-color:var(--gold)}
.vtitle{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:600;margin-top:22px;min-height:1.4em}
.vnote{font-size:14px;color:var(--dim);margin-top:8px;line-height:1.6;min-height:3.2em}
/* ask */
.ask{display:flex;gap:5vw;align-items:center}
.facts{list-style:none;font-size:18px;line-height:2.1;text-align:left}
.facts li::before{content:'—  ';color:var(--gold)}
.qr2{text-align:center;font-size:14px;color:var(--dim);font-family:Consolas,monospace}.qr2 svg{display:block;margin:0 auto 6px}
[data-l="en"] .zh,[data-l="zh"] .en{display:none}
/* phones: the deck is built for a projector; keep it inside the screen when opened from the QR code */
@media (max-width:640px){header{padding:0 14px;gap:10px}.brand em{display:none}nav{gap:2px;overflow-x:auto;min-width:0}nav button{padding:6px 7px;flex-shrink:0}
 .slide{padding:0 16px}.slide.on{overflow-y:auto}.scene{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:24px;padding-block:20px}
 .card,#flipcard{width:100%;padding:22px 18px}footer{padding:0 14px;font-size:11px}footer .keys{display:none}}

// The same accounts twice: first placed by profit rank (all look like winners), then each slides to its t,
// and the bars drop in. Dots move with CSS transforms; play() only switches classes.
function flip(){
  const W=444,H=222,L=6,R=6,top=42,bot=192,lo=-3,hi=6,rows=STRIP.rows||[];
  const ps=rows.map(r=>Math.log10(Math.max(r[1],1))),pmin=Math.min(...ps),pmax=Math.max(...ps);
  const xr=k=>L+(k-1)/99*(W-L-R), yp=v=>bot-4-(v-pmin)/(pmax-pmin||1)*(bot-top-10);
  const xt=v=>L+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(W-L-R), sp=bot-top-14, zx=(xt(STRIP.bar||hi)+W-R)/2;
  const T=(x,y,zh,en,a)=>'<text x="'+x+'" y="'+y+'"'+(a?' text-anchor="'+a+'"':'')+'><tspan class="zh">'+zh+'</tspan><tspan class="en">'+en+'</tspan></text>';
  let s='<svg class="flip" id="flip" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="PnL top 100, by profit rank and then by t">';
  s+='<rect class="zone drop" x="'+xt(STRIP.bar)+'" y="'+top+'" width="'+(W-R-xt(STRIP.bar))+'" height="'+(bot-top)+'"/>';
  s+='<g class="ga">'+T(L,14,'PnL 前 100：每个都赚了钱','PnL top 100: every one in profit')+
     '<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+bot+'" y2="'+bot+'"/>'+
     T(L,bot+20,'#1','#1')+T(W/2,bot+20,'← 按盈利排名 →','← ranked by profit →','middle')+T(W-R,bot+20,'#100','#100','end')+'</g>';
  s+='<g class="gb">'+T(L,14,'同一批人，按证据（t）重新摆','The same accounts, placed by evidence (t)');
  for(let v=-2;v<=6;v+=2)s+='<line class="ax" x1="'+xt(v)+'" x2="'+xt(v)+'" y1="'+top+'" y2="'+bot+'"/>'+T(xt(v),bot+20,v===0?'t = 0':String(v),v===0?'t = 0':String(v),'middle');
  s+='</g><g class="gc">'+
     '<line class="ln2 drop" x1="'+xt(2)+'" x2="'+xt(2)+'" y1="'+(top-6)+'" y2="'+bot+'"/>'+
     '<line class="lnb drop" x1="'+xt(STRIP.bar)+'" x2="'+xt(STRIP.bar)+'" y1="'+(top-6)+'" y2="'+bot+'"/>'+
     T(xt(2)-5,top-12,'t = 2','t = 2','end')+'<text x="'+(xt(STRIP.bar)+5)+'" y="'+(top-12)+'" style="fill:var(--red)">'+STRIP.bar.toFixed(2)+'</text>'+
     '<text class="zt" x="'+zx+'" y="'+((top+bot)/2-4)+'" text-anchor="middle"><tspan class="zh">该在</tspan><tspan class="en">winners</tspan></text>'+'<text class="zt" x="'+zx+'" y="'+((top+bot)/2+12)+'" text-anchor="middle"><tspan class="zh">这里</tspan><tspan class="en">here</tspan></text></g>';
  rows.forEach((r,i)=>{
    const ya=yp(ps[i]), yb=top+8+((i*47)%97)/97*sp, xb=r[2]==null?xr(r[0]):xt(r[2]);
    s+='<circle class="dot'+(r[2]==null?' nt':'')+'" r="3.4" cx="0" cy="0" data-a="'+xr(r[0]).toFixed(1)+','+ya.toFixed(1)+'" data-b="'+xb.toFixed(1)+','+(r[2]==null?ya:yb).toFixed(1)+'"/>';
  });
  return s+'</svg>';
}
let flipTimers=[];
function playFlip(){
  const svg=document.getElementById('flip'),card=document.getElementById('flipcard');if(!svg)return;
  flipTimers.forEach(clearTimeout);flipTimers=[];
  const dots=[...svg.querySelectorAll('.dot')],at=(d,k)=>{const [x,y]=d.dataset[k].split(',');d.style.transform='translate('+x+'px,'+y+'px)';};
  const end=()=>{svg.classList.add('b','c');card.classList.add('d');dots.forEach(d=>at(d,'b'));};
  svg.classList.add('now');card.classList.add('now');svg.classList.remove('b','c');card.classList.remove('d');
  dots.forEach(d=>{at(d,'a');d.style.transitionDelay='';});
  svg.getBoundingClientRect();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){end();return;}
  svg.classList.remove('now');card.classList.remove('now');
  flipTimers.push(setTimeout(()=>{svg.classList.add('b');dots.forEach((d,i)=>{d.style.transitionDelay=(i*4)+'ms';at(d,'b');});},700));
  flipTimers.push(setTimeout(()=>svg.classList.add('c'),2250));
  flipTimers.push(setTimeout(()=>card.classList.add('d'),2800));
}

const stage=document.getElementById('stage'),nav=document.getElementById('nav');
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.nav;b.onclick=()=>go(i);nav.appendChild(b);
  const t=document.createElement('div');t.innerHTML=s.html;stage.appendChild(t.firstChild);});

// live demo: same engine as /wallet/ (docs/assets/hl.js)
const $=id=>document.getElementById(id), L=()=>document.body.dataset.l;
const SAY={loses:['在亏，而且不是偶然','Losing, not by chance'],luck:['分不清是不是运气','Cannot be told apart from luck'],
  clears_single:['过了单次检验，没过榜单门槛','Passes one test, not the leaderboard bar'],clears_board:['过了榜单门槛','Clears the leaderboard bar'],
  too_short:['记录太短，下不了结论','Too short to say']};
const NOTE={pnl_outside_record:['大部分 PnL 记在账户不足 $1,000 的时段，换算不成收益率。','Most of the PnL was booked while the account held under $1,000; it cannot be turned into a return.'],
  no_losing_week:['从没亏过一周：像做市或卖尾部风险，t 看不见还没发生的大亏。','No losing week: consistent with market making or selling tail risk.'],
  one_week_majority:['一周贡献了一半以上的收益。','One week produced more than half of the gains.']};
async function demo(a){
  a=a.trim().toLowerCase(); $('daddr').value=a;
  if(!/^0x[0-9a-f]{40}$/.test(a)){$('dtitle').textContent=L()==='zh'?'地址格式不对':'Not an address';return;}
  $('dtitle').textContent=L()==='zh'?'读取中…':'Reading…'; $('dnote').textContent='';
  let pf; try{pf=await HL.fetchPortfolio(a);}catch(e){$('dtitle').textContent=L()==='zh'?'连不上 Hyperliquid':'Cannot reach Hyperliquid';return;}
  const w=HL.weeklyReturns(pf), sc=HL.score(w.rets), v=HL.verdict(sc,N), fl=HL.flags(pf,w.rets,w.counted), k=L()==='zh'?0:1;
  $('dtitle').textContent=SAY[v.key][k]; $('dtitle').className='vtitle '+({loses:'c-red',luck:'c-red',clears_single:'c-gold',clears_board:'c-grn',too_short:'c-dim'}[v.key]);
  $('dscale').innerHTML=scale(sc.t); $('dt').textContent=sc.t==null?'—':sc.t.toFixed(2); $('dw').textContent=sc.weeks??'—';
  const need=HL.monthsToClear(v.bar,sc.sharpe), have=(sc.weeks||0)/4.345;
  $('dm').textContent=sc.sharpe==null?'—':need==null?(k?'never':'永远不够'):need<=have?'0':((need-have)>=24?((need-have)/12).toFixed(1)+(k?' yr':' 年'):Math.round(need-have)+(k?' mo':' 个月'));
  $('dnote').textContent=fl.map(f=>NOTE[f][k]).join(' ');
}
$('dform').addEventListener('submit',e=>{e.preventDefault();demo($('daddr').value);});
$('flip').addEventListener('click',playFlip);
document.querySelectorAll('.ex button').forEach(b=>b.onclick=()=>demo(b.dataset.a));

let cur=-1;
function go(i){if(i<0||i>=S.length||i===cur)return;cur=i;
  [...stage.children].forEach((el,k)=>el.classList.toggle('on',k===i));
  [...nav.children].forEach((el,k)=>el.classList.toggle('on',k===i));
  if(i===2)playFlip();
  if(i===3)setTimeout(()=>$('daddr').focus(),300);}
document.addEventListener('keydown',e=>{
  if(document.activeElement===$('daddr')&&e.key!=='Escape')return;
  if(e.key==='Escape')document.activeElement.blur();
  else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(/^[0-6]$/.test(e.key))go(+e.key);
  else if(e.key==='l'||e.key==='L'){document.body.dataset.l=document.body.dataset.l==='zh'?'en':'zh';}
});
go(0);

// 大屏自适应：版面按 1280×720 设计，按视口等比放大（只放大不缩小）
function fit(){document.documentElement.style.zoom=Math.max(1,Math.min(innerWidth/1280,innerHeight/720)).toFixed(3)}
addEventListener('resize',fit);fit();
