// 02 coin field: one dot per account, 46 of them light up
let coinDone=false;
function coin(){
 const c=$('coin'),g=c.getContext('2d'),W=c.width,H=c.height,cols=320,rows=Math.ceil(N/cols),sx=W/cols,sy=H/rows;
 g.clearRect(0,0,W,H);g.fillStyle='#BDB5A5';
 for(let i=0;i<N;i++){g.fillRect((i%cols)*sx+sx*.2,Math.floor(i/cols)*sy+sy*.2,sx*.6,sy*.6);}
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const pick=[...Array(46)].map(()=>Math.floor(rnd()*N));
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 pick.forEach((p,k)=>setTimeout(()=>{g.fillStyle='#B8361F';g.beginPath();g.arc((p%cols)*sx+sx/2,Math.floor(p/cols)*sy+sy/2,7,0,7);g.fill();},reduce?0:600+k*45));
}

// 06 live demo: same engine as /wallet/ (assets/hl.js)
const SAY={loses:'在亏，而且不是运气差',luck:'像运气',clears_single:'有希望，未证实',clears_board:'证据充分',too_short:'还太早，看不出来'};
const NOTE={pnl_outside_record:'大部分盈亏记在账户不足 $1,000 的时段，换算不成收益率。',no_losing_week:'一周都没亏过：像做市或卖尾部风险，t 看不见还没发生的大亏。',one_week_majority:'一周贡献了一半以上的收益。'};
async function demo(a){
 a=a.trim().toLowerCase();$('daddr').value=a;
 if(!/^0x[0-9a-f]{40}$/.test(a)){$('dtitle').textContent='地址格式不对';return;}
 $('dtitle').textContent='读取中…';$('dtitle').className='vt dim';$('dnote').textContent='';
 let pf;try{pf=await HL.fetchPortfolio(a);}catch(e){$('dtitle').textContent='连不上 Hyperliquid';return;}
 const w=HL.weeklyReturns(pf),sc=HL.score(w.rets),v=HL.verdict(sc,N),fl=HL.flags(pf,w.rets,w.counted);
 $('dtitle').textContent=SAY[v.key];$('dtitle').className='vt '+({loses:'red',luck:'red',too_short:'dim'}[v.key]||'');
 $('dt').textContent=sc.t==null?'—':sc.t.toFixed(2);$('dw').textContent=sc.weeks??'—';
 const need=HL.monthsToClear(v.bar,sc.sharpe),have=(sc.weeks||0)/4.345;
 $('dm').textContent=sc.sharpe==null?'—':need==null?'到不了':need<=have?'已过':((need-have)>=24?((need-have)/12).toFixed(1)+' 年':Math.round(need-have)+' 个月');
 $('dnote').textContent=fl.map(f=>NOTE[f]||'').join(' ');
}
