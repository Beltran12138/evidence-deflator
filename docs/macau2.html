// 02 coin field: one dot per account, 46 of them light up
function coin(){
 const c=$('coin'),g=c.getContext('2d'),W=c.width,H=c.height,cols=360,rows=Math.ceil(N/cols),sx=W/cols,sy=H/rows;
 g.clearRect(0,0,W,H);g.fillStyle='#BDB5A5';
 for(let i=0;i<N;i++){g.fillRect((i%cols)*sx+sx*.2,Math.floor(i/cols)*sy+sy*.2,sx*.6,sy*.6);}
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const pick=[...Array(46)].map(()=>Math.floor(rnd()*N));
 pick.forEach((p,k)=>setTimeout(()=>{g.fillStyle='#B8361F';g.beginPath();g.arc((p%cols)*sx+sx/2,Math.floor(p/cols)*sy+sy/2,8,0,7);g.fill();},reduce?0:500+k*40));
}
