 for(const v of [0,1,2,3,4,5])s+=`<text x="${x(v)}" y="92" text-anchor="middle" class="gt">${v}</text>`;
 s+=`<circle cx="${x(3.37)}" cy="52" r="13" fill="#FF5E50"/><text x="${x(3.37)}" y="24" text-anchor="middle" class="gl">3.37</text>`;
 s+=`<line x1="${x(4.69)}" x2="${x(4.69)}" y1="30" y2="74" stroke="#F4B740" stroke-width="5"/><text x="${x(4.69)}" y="24" text-anchor="middle" class="gl" fill="#F4B740">4.69</text>`;
 $('g1').innerHTML=s;
}

// 02 400 of the 16,939 random strategies in grey, the best of all 16,939 in red (tools: scratchpad sim, seed 20261020)
let RD=null;
fetch('data/deck-random.json').then(r=>r.json()).then(d=>{RD=d;if(cur===2)rnd();}).catch(()=>{});
function rnd(){
 if(!RD)return;const c=$('rnd'),g=c.getContext('2d'),W=c.width,H=c.height,l=90,r=30,t=30,b=60;
 const n=RD.best.length,lo=-60,hi=90,X=i=>l+i/(n-1)*(W-l-r),Y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
 g.fillStyle='#162236';g.fillRect(0,0,W,H);
 g.font='26px Consolas, monospace';g.fillStyle='#93A0B5';g.textAlign='right';
 for(const v of [-50,0,50]){g.strokeStyle=v?'#223049':'#93A0B5';g.lineWidth=v?1:2;g.beginPath();g.moveTo(l,Y(v));g.lineTo(W-r,Y(v));g.stroke();g.fillText((v>0?'+':'')+v+'%',l-12,Y(v)+9);}
 g.textAlign='left';g.fillText('0',l,H-18);g.textAlign='right';g.fillText('1.5 年',W-r,H-18);
 g.strokeStyle='rgba(203,211,224,.16)';g.lineWidth=1.6;
 for(const p of RD.grey){g.beginPath();p.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();}
 g.strokeStyle='#FF5E50';g.lineWidth=6;g.beginPath();RD.best.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
 g.fillStyle='#FF5E50';g.font='bold 34px "Noto Sans SC", sans-serif';g.textAlign='right';g.fillText('16,939 条里最好的一条',W-r-10,Y(RD.best[n-1])-22);
 $('rt').textContent=RD.t.toFixed(2);$('ra').textContent='+'+Math.round(RD.ann)+'%';
}

let cur=-1;
function go(i){if(i<0||i>=S.length||i===cur)return;cur=i;
 [...stage.children].forEach((el,k)=>el.classList.toggle('on',k===i));
 [...nav.children].forEach((el,k)=>el.classList.toggle('on',k===i));
 if(i===1)gauge();if(i===2)rnd();}
document.addEventListener('keydown',e=>{
 if(['ArrowRight','PageDown',' '].includes(e.key))go(Math.min(cur+1,S.length-1));
 else if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1);
 else if(/^[0-6]$/.test(e.key))go(+e.key);
});
go(+(new URLSearchParams(location.search).get("s")||0));
function fit(){document.documentElement.style.zoom=Math.max(1,Math.min(innerWidth/1280,innerHeight/720)).toFixed(3)}
addEventListener('resize',fit);fit();
</script>
