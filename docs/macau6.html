<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 替你下单之前（v9） · Evidence Deflator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* v8: keynote style. Black ground, white type, one red. One idea per slide, no boxes. */
:root{--bg:#050505;--ink:#F3F3F1;--mid:#A3A3A0;--low:#6B6B68;--red:#FF4B3E;--grn:#3DDC97}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
nav{position:fixed;top:14px;right:24px;display:flex;gap:4px;z-index:3}
nav button{font:12px Consolas,monospace;color:var(--low);background:none;border:0;padding:4px 6px;cursor:pointer}
nav button.on{color:var(--ink)}
footer{position:fixed;left:80px;bottom:26px;font-size:18px;color:var(--low);letter-spacing:.04em}
main{height:76.9%;display:flex;zoom:1.3}
/* content stays in the top three quarters of the screen */
.slide{display:none;flex:1;padding:50px 62px 0;flex-direction:column;justify-content:flex-start}
.slide.on{display:flex;animation:in .4s ease both}
.static .slide.on{animation:none}.static nav{display:none}
@keyframes in{from{opacity:0}to{opacity:1}}
h1{font-size:84px;font-weight:900;line-height:1.18;letter-spacing:-.01em}
h2{font-size:64px;font-weight:900;line-height:1.2;letter-spacing:-.01em}
.lede{font-size:30px;color:var(--mid);margin-top:22px;line-height:1.5;font-weight:500}
.lede b{color:var(--ink);font-weight:700}
.red{color:var(--red)}.grn{color:var(--grn)}.mid{color:var(--mid)}
.src{font-size:13px;color:var(--low);margin-top:26px;line-height:1.6}
/* 00 */
.cover{padding-top:110px}
.cover .who{margin-top:70px;font-size:26px;color:var(--mid)}.cover .who b{color:var(--ink);font-weight:700;margin-right:18px}
/* 01 */
.huge{font-size:300px;font-weight:900;line-height:.95;letter-spacing:-.04em;margin-top:10px}
.huge small{font-size:90px;letter-spacing:0;margin-left:10px}
/* 02 */
#rnd{display:block;width:100%;max-width:1760px;height:auto;margin-top:18px}
.row2{display:flex;gap:80px;margin-top:22px;align-items:baseline;flex-wrap:wrap}
.row2 div{font-size:26px;color:var(--mid)}.row2 b{font-size:54px;font-weight:900;color:var(--ink);margin-right:12px}
/* 03 */
.quote{font-size:52px;font-weight:700;line-height:1.4;margin-top:40px;max-width:1500px}
.quote span{color:var(--mid);font-weight:500}
/* 04 */
.flow{display:flex;align-items:flex-start;gap:0;margin-top:70px}
.node{min-width:300px}
.node b{display:block;font-size:56px;font-weight:900}
.node span{display:block;font-size:24px;color:var(--mid);margin-top:10px;line-height:1.45}
.node.gate b{color:var(--red);font-size:72px}
.arr{font-size:56px;color:var(--low);padding:0 46px;line-height:1.1}
.under{margin-top:60px;font-size:32px;line-height:1.6;color:var(--mid)}.under b{color:var(--ink)}
.status{margin-top:34px;font-size:22px;color:var(--low);line-height:1.7}.status b{color:var(--mid);font-weight:500}
/* 05 */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:50px;margin-top:70px;max-width:1760px}
.nums b{display:block;font-size:100px;font-weight:900;line-height:1;letter-spacing:-.03em}
.nums span{display:block;font-size:24px;color:var(--mid);margin-top:18px;line-height:1.45}
/* screenshots */
.shot{margin-top:34px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #222}
.shot img{display:block;width:100%;height:auto}
.cap{font-size:28px;color:var(--mid);margin-top:26px;line-height:1.5}.cap b{color:var(--ink)}
.pair{display:grid;grid-template-columns:1.6fr 1fr;gap:56px;align-items:start}
.side{margin-top:44px}.side b{display:block;font-size:110px;font-weight:900;line-height:1}.side b small{font-size:50px;color:var(--mid)}
.side span{display:block;font-size:24px;color:var(--mid);margin-top:12px;line-height:1.45}
/* 06 */
.cs{font-size:28px;color:var(--mid);margin-top:10px;letter-spacing:.06em}
/* 07 */
.ask{display:grid;grid-template-columns:1fr auto;gap:60px;align-items:start}
.ask ul{list-style:none;margin-top:46px;font-size:30px;line-height:1.5;color:var(--mid)}
.ask li{margin-top:16px}.ask li b{color:var(--ink)}
.qrs{display:flex;gap:28px;margin-top:10px}
.qr{text-align:center;font-size:18px;color:var(--mid)}
.qr svg,.qr img{display:block;width:230px;height:230px;margin:0 auto 12px;background:#fff;padding:12px}
.qr.big svg,.qr.big img{width:290px;height:290px}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="stage"></main>
<footer>evidencedeflator.com</footer>

const S=[
// 00
`<div class="slide cover">
 <h1>AI 替你下单之前，<br>谁来管住它？</h1>
 <div class="who"><b>伯纳德</b>Evidence Deflator 开发者 · 《AI 智能投资手册》第九章作者</div>
</div>`,
// 01
`<div class="slide">
 <div class="huge">15<small>万</small></div>
 <div class="lede">个 Robinhood 账户，已经让 <b>AI agent 替自己下单</b><br>agent 每天调用交易工具近 <b>3,000 万次</b></div>
 <div class="src">出处：Robinhood HOOD Summit 2026 官方新闻稿（公司自报）</div>
</div>`,
// 02
`<div class="slide">
 <h2>它说自己很强</h2>
 <canvas id="rnd" width="1760" height="330"></canvas>
 <div class="row2"><div><b>16,939</b>条纯随机策略</div><div><b class="red">+49%</b>最好那条的年化</div></div>
 <div class="src">本项目模拟：16,939 条零真实能力的策略、1.51 年、种子 20261020 · 同样的次数出自一家头部券商的 AI 因子挖掘（中金公司研究部《大模型系列（7）》，2026-08-03）</div>
</div>`,
// 03
`<div class="slide">
 <h2>它越界时，没人拦</h2>
 <div class="quote">「Robinhood 不控制、不监督、不监测、<br>不推荐、也不审计这些 agent。」</div>
 <div class="lede">「AI agent 下的单，风险全部由你承担。」</div>
 <div class="src">出处：Robinhood HOOD Summit 2026 新闻稿页面声明，原文：Robinhood does not control, supervise, monitor, recommend, or audit agents. / You assume all risk for trades executed by AI agents. / You can turn trade approvals off, and if you do, your agent can place orders（中文为本项目翻译）</div>
</div>`,
// 04
`<div class="slide">
 <h2>我们加了一道闸</h2>
 <div class="shot"><img src="assets/deck/gate-run.png" alt="闸门真实运行"></div>
 <div class="cap">真实运行：AI agent 想一把买 <b>5,000 美元</b> ETH，被单笔上限拦下，<b>没有拆单绕过</b>；每一笔写进改不了的账本</div>
</div>`,
// 05
`<div class="slide">
 <h2>每周一张成绩单：本事还是运气</h2>
 <div class="pair">
  <div class="shot"><img src="assets/deck/wallet-verdict.png" alt="钱包判定页"></div>
  <div class="side"><b>0<small>/100</small></b><span>Hyperliquid 盈利榜前 100 名，过线的个数</span><b style="margin-top:40px">1.0</b><span>第 3 名赚了 3.77 亿美元，可信分只有 1.0</span></div>
 </div>
 <div class="src">左：evidencedeflator.com 对盈利榜第 3 名钱包的判定页（2026-10-21 截图）· 右：钱包页 2026-10-20/21 数据</div>
</div>`,
// 06
`<div class="slide">
 <div class="cs">2026-10-19 · 证监会主席吴清</div>
 <div class="quote" style="margin-top:20px">「近期将发布实施人工智能在<br>证券期货业安全合规应用的意见」</div>
 <div class="lede">点名的新型风险：<b class="red">算法黑箱</b></div>
 <div class="src">出处：2026 金融街论坛年会主题演讲（正式文件尚未发布）</div>
</div>`,
// 07
`<div class="slide">
 <div class="ask">
  <div><h1>钱交给 AI 之前，<br><span class="red">先给它装一道闸</span></h1>
   <ul><li><b>开源 v0 已上线</b>：evidencedeflator.com/gate</li><li><b>在用 AI agent 交易？</b>扫码加我，一起试</li><li><b>16:30 自由交流</b>，我在现场</li></ul></div>
  <div class="qrs"><div class="qr big"><img src="assets/wechat-qr.png" alt="微信" onerror="this.parentNode.remove()">微信 · 伯纳德</div><div class="qr">${QR}evidencedeflator.com</div></div>
 </div>
</div>`
];
const stage=document.getElementById('stage'),nav=document.getElementById('nav');
S.forEach((h,i)=>{const b=document.createElement('button');b.textContent=String(i).padStart(2,'0');b.onclick=()=>go(i);nav.appendChild(b);
 const t=document.createElement('div');t.innerHTML=h.trim();stage.appendChild(t.firstChild);});
const $=id=>document.getElementById(id);
if(new URLSearchParams(location.search).has('static'))document.documentElement.classList.add('static');

// 02: 400 of the 16,939 random strategies, faint; the best of all 16,939 in red (data/deck-random.json)
let RD=null;
fetch('data/deck-random.json').then(r=>r.json()).then(d=>{RD=d;if(cur===2)rnd();}).catch(()=>{});
function rnd(){
 if(!RD)return;const c=$('rnd'),g=c.getContext('2d'),W=c.width,H=c.height,l=10,r=10,t=20,b=20;
 const n=RD.best.length,lo=-60,hi=85,X=i=>l+i/(n-1)*(W-l-r),Y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
 g.clearRect(0,0,W,H);
 g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1;g.beginPath();g.moveTo(l,Y(0));g.lineTo(W-r,Y(0));g.stroke();
 g.strokeStyle='rgba(243,243,241,.10)';g.lineWidth=1.4;
 for(const p of RD.grey){g.beginPath();p.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();}
 g.strokeStyle='#FF4B3E';g.lineWidth=5;g.beginPath();RD.best.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
}

let cur=-1;
function go(i){if(i<0||i>=S.length||i===cur)return;cur=i;
 [...stage.children].forEach((el,k)=>el.classList.toggle('on',k===i));
 [...nav.children].forEach((el,k)=>el.classList.toggle('on',k===i));
 if(i===2)rnd();}
document.addEventListener('keydown',e=>{
 if(['ArrowRight','PageDown',' '].includes(e.key))go(Math.min(cur+1,S.length-1));
 else if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1);
 else if(/^[0-7]$/.test(e.key))go(+e.key);
});
go(+(new URLSearchParams(location.search).get("s")||0));
function fit(){document.documentElement.style.zoom=Math.max(1,Math.min(innerWidth/1920,innerHeight/1080)).toFixed(3)}
addEventListener('resize',fit);fit();
</script>
