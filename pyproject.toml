[build-system]
# 77+ for the SPDX `license` string and `license-files`; this floor applies to
# the build environment only, not to consumers — the wheel is py3-none-any.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-deflator"
version = "0.2.0"
description = "Evidence Deflator: how much of the evidence behind an AI trading result actually counts. Given a model's knowledge cutoff, a test window and the number of attempts, returns clean months, months needed and a verdict. Also separates factual from definitional disagreement between risk sources."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Floor established by reading the source, not by a test matrix: no lowercase
# generics, no `X | Y` unions, no match statements, and every module carries
# `from __future__ import annotations`. Only 3.11 has actually been run. Stated
# this way because "supports 3.8" and "was tested on 3.8" are different claims
# and this package exists to keep those apart.
requires-python = ">=3.8"
authors = [{ name = "Path B" }]
keywords = [
    "evidence-deflator",
    "backtest",
    "look-ahead",
    "knowledge-cutoff",
    "deflated-sharpe",
    "leaderboard",
    "risk",
    "normalization",
    "decision-confidence",
    "agent",
    "mcp",
    "token",
    "crypto",
    "scoring",
    "framework",
    "audit",
]
classifiers = [
    # No per-version Python classifiers on purpose — see the note on
    # requires-python. Listing 3.8-3.13 would assert a test matrix that does
    # not exist.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://evidencedeflator.com/"
Repository = "https://github.com/Beltran12138/evidence-deflator"
Issues = "https://github.com/Beltran12138/evidence-deflator/issues"

[project.optional-dependencies]
# Core stays dependency-free. The MCP server is opt-in.
mcp = ["mcp>=1.28"]
# Signed trading mandates (eth-account) and the Hyperliquid broker (the SDK pins eth-account <0.14).
gate = ["eth-account>=0.10,<0.14", "hyperliquid-python-sdk>=0.24"]
dev = ["pytest>=7"]

[project.scripts]
evidence-deflator-mcp = "mcp_server:main"
# Old name kept so existing MCP configs keep working.
decision-confidence-mcp = "mcp_server:main"
# Rule gate and ledger in front of an agent's trading account (src/agent_gate.py).
agent-gate = "agent_gate:main"
agent-gate-mcp = "gate_server:main"
agent-gate-stress = "gate_stress:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["normalize", "decision_confidence", "evidence_deflator", "effective_window", "counterfactual", "messages", "trial_count", "track_record", "trace_audit", "hl_wallet", "mcp_server", "agent_gate", "gate_server", "mandate", "gate_adapters", "gate_stress", "mandate_examples", "mandate_text", "mandate_templates"]
packages = ["adapters"]
